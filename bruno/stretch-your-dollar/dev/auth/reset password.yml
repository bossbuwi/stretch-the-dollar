info:
  name: reset password
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:{{port}}/auth/password/change
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "1234",
        "newPassword": "1245",
        "confirmNewPassword": "1245"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
