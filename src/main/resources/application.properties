spring.application.name=dollar
server.port=8080

### Spring JPA ###
#Allows Hibernate to use database enums instead of a plain varchar text
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=NAMED_ENUM
#Show the SQL in the console
spring.jpa.show-sql=false
#Show the bind parameters (The values for the '?' in the query)
logging.level.org.hibernate.orm.jdbc.bind=OFF
#Make the SQL look pretty (formatted) instead of one long line
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

### PostgreSQL Config ###
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

### Liquibase ###
liquibase.analytics.enabled=false
logging.level.liquibase=INFO
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog-master.xml

### Logging ###
logging.level.root=INFO
logging.level.com.paradoxdevs.dollar=DEBUG
#logging.file.name=logs/dollar-app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.org.springframework.web.filter=DEBUG
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR