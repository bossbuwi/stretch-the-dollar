name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: ["master"] # Or "main" if that's your default branch
    paths:
      - 'docs/**' # <-- This is the key. Only triggers if files in the docs/ folder change
  workflow_dispatch: # Allows you to manually run this workflow from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # If you are using a static site generator (like Jekyll, MkDocs, Hugo, etc.),
      # add your build steps here. For example, for Jekyll:
      # - name: Build with Jekyll
      #   uses: actions/jekyll-build-pages@v1
      #   with:
      #     source: ./docs
      #     destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The path to your documentation files.
          # If you have a build step, this should point to the output directory (e.g., ./_site).
          # If your docs are plain HTML/CSS/JS, point it directly to './docs'.
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4